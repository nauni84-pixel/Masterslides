<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Filling Rules Manager (GitHub Edition)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { height: 100vh; overflow-y: auto; border-right: 1px solid #dee2e6; background: white; }
        .content { height: 100vh; overflow-y: auto; padding: 20px; }
        .tag-item { cursor: pointer; padding: 10px; border-bottom: 1px solid #eee; }
        .tag-item:hover { background-color: #f0f7ff; }
        .tag-item.active { background-color: #e7f1ff; border-left: 4px solid #0d6efd; }
        .lock-badge { font-size: 0.7rem; }
        .history-card { border-left: 4px solid #198754; margin-bottom: 10px; }
        #tokenModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        #homePage { padding: 40px; }
        .main-app { display: none; }
        .back-btn { margin-bottom: 20px; cursor: pointer; color: #0d6efd; }
        .table-responsive { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 20px; }
        .btn-delete { color: #dc3545; cursor: pointer; }
        .btn-delete:hover { color: #a71d2a; }
    </style>
</head>
<body>
    <div id="tokenModal">
        <div class="card p-4 shadow-lg" style="width: 400px;">
            <h5 class="card-title"><i class="fab fa-github"></i> GitHub Connect</h5>
            <p class="small text-muted">Enter your GitHub Personal Access Token to enable editing.</p>
            <input type="password" id="githubToken" class="form-control mb-3" placeholder="ghp_xxxxxxxxxxxx">
            <button id="saveConfigBtn" class="btn btn-primary w-100">Login to Dashboard</button>
            <div class="mt-2 text-center small"><a href="https://github.com/settings/tokens" target="_blank">Get token here</a></div>
        </div>
    </div>

    <!-- Home Page -->
    <div id="homePage" style="display:none;">
        <div class="container-fluid px-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-layer-group"></i> MasterSlides Hub</h2>
                <div id="adminControlsHome" style="display:none">
                    <button class="btn btn-success" onclick="document.getElementById('excelImport').click()">
                        <i class="fas fa-plus"></i> Import New Excel
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>MasterSlide Name</th>
                            <th>Version</th>
                            <th>Last Updated</th>
                            <th>Last Updated By</th>
                            <th>History</th>
                            <th id="adminDeleteHeader" style="display:none">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="datasetTableBody">
                        <!-- Content loaded by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Main App Content (Hidden by default) -->
    <div class="container-fluid main-app" id="mainApp">
        <div class="row">
            <div class="col-md-3 sidebar p-3">
                <div class="back-btn" onclick="showHome()"><i class="fas fa-arrow-left"></i> Back to Hub</div>
                <h5 class="mb-3">XML Tags</h5>
                <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search tags...">
                <div id="tagList"><div class="text-center p-5"><div class="spinner-border spinner-border-sm"></div></div></div>
            </div>
            <div class="col-md-9 content">
                <nav class="navbar navbar-light bg-light mb-4 px-3 shadow-sm rounded d-flex justify-content-between">
                    <span class="navbar-brand mb-0 h1" id="currentDatasetTitle">Rules Manager</span>
                    <div id="userInfo" class="d-flex align-items-center">
                        <span id="currentUserDisplay" class="badge bg-dark ms-2"></span>
                        <button id="viewHistoryBtn" class="btn btn-sm btn-outline-secondary ms-2">Commits</button>
                    </div>
                </nav>
                <div id="editorArea"></div>
                <div id="historyArea" style="display: none;">
                    <h4>Commit History</h4>
                    <div id="historyList" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="excelImport" style="display:none" accept=".xlsx, .xlsm">

    <!-- Excel Parsing Library -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
